<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Control Remoto - Smart TV Hub</title>
  <link rel="icon" type="image/jpeg" href="/img/Icono.jpg">
  <link rel="apple-touch-icon" href="/img/Icono.jpg">
  <meta name="theme-color" content="#020718">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      height: 100%;
      background-color: #020718;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 15%, #081a4a 0%, #020718 80%);
      color: #f1f3f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 12px max(14px, env(safe-area-inset-bottom, 14px));
      box-sizing: border-box;
    }

    /* BARRA SUPERIOR */
    .remote-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(8, 26, 74, 0.7);
      border: 1px solid rgba(13, 52, 186, 0.5);
      border-radius: 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
      backdrop-filter: blur(8px);
    }

    .remote-brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .remote-logo {
      height: min(7vw, 32px);
      max-width: 110px;
      object-fit: contain;
      border-radius: 4px;
    }

    .remote-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(11px, 3.5vw, 14px);
      font-weight: 600;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff5555;
      transition: background 0.3s;
    }

    .status-dot.connected {
      background: #009d71;
      box-shadow: 0 0 10px #009d71;
    }

    .status-dot.connecting {
      background: #ffaa00;
    }

    .btn-pin-pill {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: clamp(10px, 3vw, 12px);
      font-weight: bold;
      cursor: pointer;
    }

    /* CONTENEDOR PRINCIPAL - 100% ANCHO DE PANTALLA */
    .remote-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: min(3.5vw, 14px);
      flex: 1;
    }

    /* BUSCADOR */
    .search-sync-card {
      width: 100%;
      background: rgba(8, 26, 74, 0.6);
      border: 1px solid rgba(13, 52, 186, 0.5);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-sync-input {
      flex: 1;
      background: #020718;
      border: 1px solid rgba(13, 52, 186, 0.8);
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: clamp(13px, 4vw, 16px);
      outline: none;
    }

    .search-sync-input:focus {
      border-color: #009d71;
      box-shadow: 0 0 8px rgba(0, 157, 113, 0.4);
    }

    .btn-search-send {
      background: #009d71;
      color: #020718;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: clamp(12px, 3.8vw, 15px);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* BOTONES AUXILIARES Y MULTIMEDIA EN GRID EXPANSIBLE */
    .controls-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .controls-grid-2 {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .controls-grid-3 {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .remote-btn {
      background: #081a4a;
      border: 1px solid rgba(13, 52, 186, 0.7);
      color: #f1f3f5;
      padding: min(3vw, 12px) 4px;
      border-radius: 12px;
      font-size: clamp(11px, 3.4vw, 14px);
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: all 0.12s ease;
      touch-action: manipulation;
      min-height: min(14vw, 58px);
    }

    .remote-btn svg {
      width: clamp(18px, 5.5vw, 24px);
      height: clamp(18px, 5.5vw, 24px);
    }

    .remote-btn:active {
      background: #009d71;
      color: #020718;
      border-color: #009d71;
      transform: scale(0.95);
    }

    .remote-btn-accent {
      background: rgba(0, 157, 113, 0.2);
      border-color: #009d71;
      color: #009d71;
    }

    .remote-btn-accent:active {
      background: #009d71;
      color: #020718;
    }

    /* D-PAD COMPLETAMENTE ADAPTATIVO AL ANCHO */
    .dpad-container {
      position: relative;
      width: min(76vw, 280px);
      height: min(76vw, 280px);
      background: radial-gradient(circle, #081a4a 35%, #030a21 75%);
      border: 3px solid rgba(13, 52, 186, 0.6);
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 2px 10px rgba(0, 157, 113, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
      flex-shrink: 0;
    }

    .dpad-btn {
      position: absolute;
      background: #081a4a;
      border: 1px solid rgba(13, 52, 186, 0.5);
      color: #ffffff;
      font-size: clamp(18px, 5vw, 24px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    .dpad-btn:active {
      background: #009d71;
      color: #020718;
      transform: scale(0.95);
    }

    .dpad-up {
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 38%;
      height: 25%;
      border-radius: 40px 40px 10px 10px;
    }

    .dpad-down {
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 38%;
      height: 25%;
      border-radius: 10px 10px 40px 40px;
    }

    .dpad-left {
      left: 6%;
      top: 50%;
      transform: translateY(-50%);
      width: 25%;
      height: 38%;
      border-radius: 40px 10px 10px 40px;
    }

    .dpad-right {
      right: 6%;
      top: 50%;
      transform: translateY(-50%);
      width: 25%;
      height: 38%;
      border-radius: 10px 40px 40px 10px;
    }

    .dpad-center-ok {
      width: 34%;
      height: 34%;
      border-radius: 50%;
      background: linear-gradient(135deg, #00ba88 0%, #00875e 100%);
      color: #020718;
      font-size: clamp(16px, 5.5vw, 24px);
      font-weight: 900;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 18px rgba(0, 157, 113, 0.6);
      z-index: 2;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
      touch-action: manipulation;
    }

    .dpad-center-ok:active {
      background: #ffffff;
      color: #009d71;
      transform: scale(0.93);
      box-shadow: 0 0 25px #009d71;
    }

    /* MODAL DE EMPAREJAMIENTO DE PIN */
    .pair-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 7, 24, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .pair-box {
      width: 90%;
      max-width: 340px;
      background: #081a4a;
      border: 2px solid #009d71;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .pair-pin-input {
      width: 100%;
      font-size: 32px;
      letter-spacing: 8px;
      text-align: center;
      background: #020718;
      border: 2px solid #009d71;
      color: #009d71;
      padding: 12px;
      border-radius: 10px;
      margin: 16px 0;
      font-weight: 900;
      outline: none;
    }

    .btn-pair-submit {
      width: 100%;
      background: #009d71;
      color: #020718;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- MODAL DE PIN -->
  <div id="pair-modal" class="pair-modal" style="display: none;">
    <div class="pair-box">
      <img src="/img/Nombre.jpg" alt="Logo" style="height: 36px; max-width: 140px; object-fit: contain; margin-bottom: 10px;">
      <h3 style="margin-bottom: 8px; color: #fff;">Conectar con tu Smart TV</h3>
      <p style="font-size: 13px; color: #9aa0a6;">Ingresa el código PIN de 4 dígitos que aparece en la pantalla del televisor:</p>
      <input type="number" id="input-pin" class="pair-pin-input" placeholder="0000" maxlength="4" pattern="[0-9]*" inputmode="numeric">
      <button id="btn-pair-connect" class="btn-pair-submit">CONECTAR CONTROL</button>
    </div>
  </div>

  <!-- BARRA DE ESTADO -->
  <header class="remote-header">
    <div class="remote-brand">
      <img src="/img/Nombre.jpg" alt="Smart TV Hub" class="remote-logo">
    </div>
    <div class="remote-status">
      <div id="status-dot" class="status-dot connecting"></div>
      <span id="status-text">Conectando...</span>
    </div>
    <button id="btn-change-pin" class="btn-pin-pill">PIN: <span id="label-pin">----</span></button>
  </header>

  <!-- CUERPO DEL CONTROL -->
  <main class="remote-body">

    <!-- BUSCADOR -->
    <div class="search-sync-card">
      <input type="text" id="remote-search-input" class="search-sync-input" placeholder="Escribe para buscar en la TV...">
      <button id="btn-remote-search-submit" class="btn-search-send">Buscar</button>
    </div>

    <!-- ACCIONES DE NAVEGACIÓN -->
    <div class="controls-grid">
      <button class="remote-btn" data-action="back" title="Volver / Salir">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        <span>Atrás</span>
      </button>
      <button class="remote-btn" data-action="home" title="Inicio / Catálogo">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Inicio</span>
      </button>
      <button class="remote-btn" data-action="fullscreen" title="Pantalla Completa">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <span>Pantalla</span>
      </button>
      <button class="remote-btn" data-action="menu" title="Menú Lateral">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        <span>Filtros</span>
      </button>
    </div>

    <!-- CRUCETA D-PAD PORCENTUAL -->
    <div class="dpad-container">
      <button class="dpad-btn dpad-up" data-action="up" aria-label="Arriba">&#9650;</button>
      <button class="dpad-btn dpad-down" data-action="down" aria-label="Abajo">&#9660;</button>
      <button class="dpad-btn dpad-left" data-action="left" aria-label="Izquierda">&#9668;</button>
      <button class="dpad-btn dpad-right" data-action="right" aria-label="Derecha">&#9658;</button>
      <button class="dpad-center-ok" data-action="ok" aria-label="OK">OK</button>
    </div>

    <!-- AUDIO Y SUBTÍTULOS -->
    <div class="controls-grid-2">
      <button class="remote-btn remote-btn-accent" data-action="audio" title="Cambiar pista de Audio">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
        <span>Audio (Latino/VO)</span>
      </button>
      <button class="remote-btn remote-btn-accent" data-action="subs" title="Cambiar Subtítulos">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-9 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></svg>
        <span>Subtítulos</span>
      </button>
    </div>

    <!-- REPRODUCCIÓN -->
    <div class="controls-grid-3">
      <button class="remote-btn" data-action="rewind" title="Retroceder 10 segundos">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
        <span>-10s</span>
      </button>
      <button class="remote-btn remote-btn-accent" data-action="playpause" title="Reproducir / Pausar">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span>Play / Pausa</span>
      </button>
      <button class="remote-btn" data-action="forward" title="Avanzar 10 segundos">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
        <span>+10s</span>
      </button>
    </div>

    <!-- VOLUMEN -->
    <div class="controls-grid-3">
      <button class="remote-btn" data-action="voldown" title="Bajar Volumen">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
        <span>Vol -</span>
      </button>
      <button class="remote-btn" data-action="mute" title="Silenciar / Activar Sonido">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        <span>Mute</span>
      </button>
      <button class="remote-btn" data-action="volup" title="Subir Volumen">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <span>Vol +</span>
      </button>
    </div>

  </main>

  <script src="/js/paho-mqtt.min.js"></script>
  <script>
    (function () {
      var client = null;
      var currentPin = '';
      var topicName = '';
      var isConnected = false;

      var statusDot = document.getElementById('status-dot');
      var statusText = document.getElementById('status-text');
      var labelPin = document.getElementById('label-pin');
      var pairModal = document.getElementById('pair-modal');
      var inputPin = document.getElementById('input-pin');
      var btnPairConnect = document.getElementById('btn-pair-connect');
      var btnChangePin = document.getElementById('btn-change-pin');
      var searchInput = document.getElementById('remote-search-input');
      var searchBtn = document.getElementById('btn-remote-search-submit');

      function vibrate() {
        if (typeof navigator.vibrate === 'function') {
          try { navigator.vibrate(25); } catch (e) { }
        }
      }

      function updateStatus(state, msg) {
        statusDot.className = 'status-dot ' + state;
        statusText.innerText = msg;
      }

      function getUrlParam(param) {
        var match = window.location.search.match(new RegExp('[?&]' + param + '=([^&]+)'));
        return match ? decodeURIComponent(match[1]) : null;
      }

      function initConnection(pin) {
        if (!pin || pin.length < 4) {
          pairModal.style.display = 'flex';
          return;
        }

        currentPin = pin;
        labelPin.innerText = pin;
        topicName = 'smart_tv_hub_' + pin;
        try { localStorage.setItem('tv_remote_pin', pin); } catch (e) { }

        pairModal.style.display = 'none';
        updateStatus('connecting', 'Conectando...');

        if (client) {
          try { client.disconnect(); } catch (eDisconnect) { }
        }

        var clientId = 'mobile_' + Math.random().toString(16).substr(2, 8);
        client = new Paho.MQTT.Client('broker.hivemq.com', 8884, '/mqtt', clientId);

        client.onConnectionLost = function (response) {
          isConnected = false;
          updateStatus('disconnected', 'Desconectado');
          setTimeout(function () { initConnection(currentPin); }, 3000);
        };

        client.connect({
          useSSL: true,
          timeout: 10,
          keepAliveInterval: 30,
          onSuccess: function () {
            isConnected = true;
            updateStatus('connected', 'Conectado');
            sendAction('phone_connected');
          },
          onFailure: function (err) {
            isConnected = false;
            updateStatus('disconnected', 'Fallo conexión');
            setTimeout(function () { initConnection(currentPin); }, 4000);
          }
        });
      }

      function sendAction(action, payload) {
        vibrate();
        if (!client || !isConnected) return;
        try {
          var data = { action: action, payload: payload || null, time: Date.now() };
          var msg = new Paho.MQTT.Message(JSON.stringify(data));
          msg.destinationName = topicName;
          msg.qos = 0;
          client.send(msg);
        } catch (e) {
          console.warn('Error enviando comando:', e);
        }
      }

      var allButtons = document.querySelectorAll('[data-action]');
      for (var b = 0; b < allButtons.length; b++) {
        (function (btn) {
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            var act = btn.getAttribute('data-action');
            if (act) sendAction(act);
          }, false);
        })(allButtons[b]);
      }

      function doSearch() {
        var query = searchInput.value;
        if (query && query.trim().length > 0) {
          sendAction('search', { query: query.trim() });
          searchInput.blur();
        }
      }

      searchBtn.addEventListener('click', doSearch, false);
      searchInput.addEventListener('keydown', function (e) {
        if (e.keyCode === 13) {
          doSearch();
          e.preventDefault();
        }
      }, false);

      btnPairConnect.addEventListener('click', function () {
        var val = inputPin.value.trim();
        if (val.length >= 4) {
          initConnection(val);
        } else {
          alert('Por favor ingresa el PIN de 4 dígitos');
        }
      }, false);

      btnChangePin.addEventListener('click', function () {
        pairModal.style.display = 'flex';
        inputPin.value = currentPin;
      }, false);

      var pinUrl = getUrlParam('pin');
      var savedPin = '';
      try { savedPin = localStorage.getItem('tv_remote_pin'); } catch (eStore) { }

      if (pinUrl) {
        initConnection(pinUrl);
      } else if (savedPin) {
        initConnection(savedPin);
      } else {
        pairModal.style.display = 'flex';
      }

    })();
  </script>
</body>
</html>
